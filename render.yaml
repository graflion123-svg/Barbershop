services:
  # ===================================================
  # 1. BACKEND WEB SERVICE (Node.js + Express + Prisma)
  # ===================================================
  - type: web
    name: barbershop-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npm run render:build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Tashkent
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # ===================================================
  # 2. FRONTEND STATIC SITE (React + Vite + Tailwind)
  # ===================================================
  - type: web
    runtime: static
    name: barbershop-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
