<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5e08c"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7c11"/>
      <stop offset="100%" stop-color="#f3d87a"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#4a3b10"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1100" rx="36" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Border -->
  <rect x="24" y="24" width="752" height="1052" rx="28" fill="none" stroke="url(#goldBorder)" stroke-width="2.5" opacity="0.8"/>
  <rect x="36" y="36" width="728" height="1028" rx="20" fill="none" stroke="#d4af37" stroke-width="1" stroke-dasharray="6,4" opacity="0.3"/>

  <!-- Top Logo / Header -->
  <g transform="translate(400, 140)" text-anchor="middle">
    <!-- Scissors Icon -->
    <path d="M-22,-45 C-35,-45 -42,-35 -42,-22 C-42,-8 -30,0 -16,-4 L16,40 C12,44 6,46 0,46" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-25" cy="-25" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="25" cy="-25" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M-15,-15 L15,15" stroke="url(#goldGrad)" stroke-width="3"/>
    <path d="M15,-15 L-15,15" stroke="url(#goldGrad)" stroke-width="3"/>
    
    <text y="70" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" letter-spacing="6">BARBERSHOP</text>
    <text y="105" font-family="'Inter', sans-serif" font-size="14" fill="#a1a1aa" letter-spacing="4">PREMIUM ERKAKLAR SALONI</text>
  </g>

  <!-- Title Callout -->
