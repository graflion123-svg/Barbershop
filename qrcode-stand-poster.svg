    <text font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="1">MENING BUYURTMALARIM</text>
    <text y="34" font-family="'Inter', sans-serif" font-size="16" fill="#9ca3af">Navbatingiz va qabul vaqtingizni onlayn tekshiring</text>
  </g>

